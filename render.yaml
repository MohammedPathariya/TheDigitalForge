services:
  - type: web
    name: digital-forge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_NAME
        value: gpt-4o-mini
      - key: PYTHON_VERSION
        value: "3.11.12"
      - key: CORS_ORIGINS
        sync: false
      - key: SANDBOX_BACKEND
        value: modal
      - key: MODAL_SANDBOX_APP
        value: digital-forge-sandbox
      - key: MAX_ACTIVE_RUNS
        value: "1"
      - key: MAX_DAILY_MODEL_RUNS
        value: "20"
      - key: RATE_LIMIT_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RUN_TIMEOUT_SECONDS
        value: "300"
